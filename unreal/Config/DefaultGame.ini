[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Sovereign

[/Script/UnrealEd.ProjectPackagingSettings]
; The UI's icons are plain PNG files Slate loads at run time (Content/Slate, plan D).
+DirectoriesToAlwaysStageAsUFS=(Path="Slate")
; The art kits, the rigged people and the sounds are loaded by path at run time (SovArt, SovAudio), never referenced by
; a map, so the cook would leave them out of a packaged game.
+DirectoriesToAlwaysCook=(Path="/Game/Art")
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
